<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scientific Method & AI Tools – Assessment</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; overflow-x: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 50%, #db2777 100%);
    background-size: 400% 400%;
    animation: gradientShift 18s ease infinite;
    min-height: 100vh; display: flex; justify-content: center;
    align-items: flex-start; padding: 60px 16px 80px;
    color: #f8fafc; position: relative; overflow-x: hidden;
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  #bubbleLayer { position: fixed; inset: 0; z-index: 0;
    pointer-events: none; overflow: hidden; }
  .bubble {
    position: absolute; bottom: -140px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%,
      rgba(255,255,255,1) 0%, rgba(255,255,255,0.9) 6%,
      rgba(255,255,255,0.30) 24%, rgba(255,255,255,0.06) 50%,
      rgba(255,255,255,0.02) 72%, rgba(255,255,255,0.42) 100%);
    border: 1.5px solid rgba(255,255,255,0.9);
    box-shadow: 0 0 24px rgba(255,255,255,0.85),
                0 0 48px rgba(180,220,255,0.55),
                inset -8px -8px 16px rgba(255,255,255,0.55),
                inset 8px 8px 16px rgba(255,255,255,0.35);
    animation: rise linear forwards, wobble 3.2s ease-in-out infinite;
    will-change: transform, opacity; mix-blend-mode: screen;
  }
  .bubble::before {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 68% 74%,
      var(--tint, rgba(255,255,255,0.35)) 0%, rgba(255,255,255,0) 55%);
    opacity: 0.75; filter: blur(2px);
  }
  .bubble::after {
    content: ""; position: absolute; top: 16%; left: 20%;
    width: 24%; height: 24%; border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,1), rgba(255,255,255,0) 72%);
    filter: blur(0.5px);
  }
  @keyframes rise {
    0% { transform: translateY(0) translateX(0) scale(0.9); opacity: 0; }
    12% { opacity: 1; } 88% { opacity: 1; }
    100% { transform: translateY(-115vh) translateX(var(--drift))
           scale(1.05); opacity: 0; }
  }
  @keyframes wobble { 0%,100%{margin-left:0} 50%{margin-left:6px} }
  .bubble.pop { animation: pop 0.45s ease-out forwards; }
  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.55); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }
  .card {
    position: relative; z-index: 10; max-width: 780px; width: 100%;
    border-radius: 24px; overflow: hidden;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(6px) saturate(120%);
    -webkit-backdrop-filter: blur(6px) saturate(120%);
    border: 1px solid rgba(255,255,255,0.55);
    box-shadow: 0 25px 60px rgba(0,0,0,0.30),
                inset 0 1px 0 rgba(255,255,255,0.55);
    animation: cardIn 0.7s ease-out;
  }
  @keyframes cardIn {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .card::before {
    content: ""; position: absolute; inset: -1px;
    border-radius: 24px; padding: 1px;
    background: linear-gradient(120deg,
      rgba(255,255,255,0.95), rgba(255,255,255,0.08) 30%,
      rgba(255,255,255,0.08) 70%, rgba(255,255,255,0.85));
    -webkit-mask: linear-gradient(#000 0 0) content-box,
                  linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none; opacity: 0.85;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: 24px;
    background: radial-gradient(420px circle at var(--mx,50%) var(--my,0%),
      rgba(255,255,255,0.16), transparent 45%);
    pointer-events: none; transition: background 0.15s ease-out;
  }
  .header {
    position: relative; z-index: 1; padding: 36px 40px 28px;
    background: linear-gradient(135deg,
      rgba(99,102,241,0.22), rgba(147,51,234,0.18));
    border-bottom: 1px solid rgba(255,255,255,0.35); color: #fff;
  }
  .header h1 { font-size: 26px; margin-bottom: 10px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.45); }
  .header p { font-size: 15px; line-height: 1.55;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 1px 8px rgba(0,0,0,0.45); }
  form { position: relative; z-index: 1; padding: 32px 36px 40px; }
  .field {
    margin-bottom: 22px; padding: 18px 18px 20px; border-radius: 16px;
    background: rgba(255,255,255,0.015);
    border: 1px solid rgba(255,255,255,0.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.55),
                0 4px 16px rgba(0,0,0,0.12);
    animation: fieldIn 0.6s ease-out backwards;
    transition: border-color 0.25s, background 0.25s;
  }
  .field:hover { background: rgba(255,255,255,0.05);
                 border-color: rgba(255,255,255,0.85); }
  .field:nth-child(1) { animation-delay: 0.10s; }
  .field:nth-child(2) { animation-delay: 0.18s; }
  .field:nth-child(3) { animation-delay: 0.26s; }
  .field:nth-child(4) { animation-delay: 0.34s; }
  .field:nth-child(5) { animation-delay: 0.42s; }
  .field:nth-child(6) { animation-delay: 0.50s; }
  @keyframes fieldIn {
    from { transform: translateY(12px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  label { display: block; font-weight: 600; margin-bottom: 10px;
    font-size: 14px; color: #ffffff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
  label span { color: #fbcfe8; }
  input, textarea, select {
    width: 100%; padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 10px; font-size: 15px; font-family: inherit;
    transition: all 0.2s; background: rgba(255,255,255,0.02);
    color: #ffffff; text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  input::placeholder, textarea::placeholder {
    color: rgba(255,255,255,0.75);
    text-shadow: 0 1px 4px rgba(0,0,0,0.45); }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: #ffffff;
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.28);
  }
  textarea { resize: vertical; min-height: 90px; }
  button {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg,
      rgba(79,70,229,0.85), rgba(147,51,234,0.85));
    color: #fff; border: 1px solid rgba(255,255,255,0.5);
    border-radius: 14px; font-size: 16px; font-weight: 700;
    letter-spacing: 0.4px; cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    margin-top: 8px; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(147,51,234,0.45),
                inset 0 1px 0 rgba(255,255,255,0.6);
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  button:hover { transform: translateY(-2px);
    box-shadow: 0 14px 40px rgba(147,51,234,0.65),
                inset 0 1px 0 rgba(255,255,255,0.7); }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .success { display: none; text-align: center; padding: 50px 40px;
    color: #ffffff; font-size: 18px; font-weight: 600;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  .success .check { font-size: 64px; display: block; margin-bottom: 14px; }
  #audioDot {
    position: fixed; top: 16px; right: 16px; z-index: 999;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; font-size: 13px; font-weight: 600;
    color: #fff; background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 999px; backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    opacity: 0.55; transition: opacity 0.4s, transform 0.4s;
  }
  #audioDot.live { opacity: 1; transform: scale(1.03); }
  #audioDot .pulse {
    width: 8px; height: 8px; border-radius: 50%; background: #34d399;
    box-shadow: 0 0 8px #34d399, 0 0 14px rgba(52,211,153,0.7);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(0.9); opacity: 0.8; }
    50%     { transform: scale(1.25); opacity: 1; }
  }
  @media (max-width: 600px) {
    body { padding: 40px 10px 60px; }
    .header { padding: 26px 22px 20px; }
    .header h1 { font-size: 21px; }
    form { padding: 22px 18px 30px; }
    .field { padding: 14px 14px 16px; }
    #audioDot { font-size: 12px; padding: 6px 10px; }
  }
</style>
</head>
<body>

<div id="audioDot"><span class="pulse"></span> Sound on</div>
<div id="bubbleLayer"></div>

<div class="card" id="glassCard">
  <div class="header">
    <h1>🔬 Scientific Method &amp; AI Tools Assessment</h1>
    <p>Please answer thoughtfully. Your responses will be used for justification and evaluation of your research approach.</p>
  </div>

  <form id="assessmentForm">
    <div class="field"><label>Full Name <span>*</span></label>
      <input type="text" name="name" required placeholder="Your full name" /></div>
    <div class="field"><label>Research Question You Are Addressing <span>*</span></label>
      <textarea name="research_question" required placeholder="State your scientific question clearly..."></textarea></div>
    <div class="field"><label>How You Used AI / Google Tools <span>*</span></label>
      <textarea name="ai_tools" required placeholder="Which tools (Google, AI assistants, etc.) and how did they help?"></textarea></div>
    <div class="field"><label>Scientific Method Steps Applied <span>*</span></label>
      <textarea name="scientific_method" required placeholder="Observation → Hypothesis → Experiment → Analysis → Conclusion..."></textarea></div>
    <div class="field"><label>Justification / Reasoning <span>*</span></label>
      <textarea name="justification" required placeholder="Why did you choose this approach? Support your reasoning."></textarea></div>
    <div class="field"><label>References / Links (optional)</label>
      <textarea name="references" placeholder="Any sources, papers, or links used..."></textarea></div>
    <button type="submit" id="submitBtn">Submit Response</button>
  </form>

  <div class="success" id="successMsg">
    <span class="check">✅</span>
    Thank you! Your response has been submitted successfully.
  </div>
</div>

<script>
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().then(() =>
        document.getElementById('audioDot').classList.add('live')
      ).catch(() => {});
    } else if (audioCtx) {
      document.getElementById('audioDot').classList.add('live');
    }
    return audioCtx;
  }
  window.addEventListener('load', initAudio);
  ['pointerdown','touchstart','mousedown','keydown','scroll','mousemove']
    .forEach(ev => window.addEventListener(ev, () => initAudio(),
      { once: true, passive: true }));

  function playPop(sizeRatio) {
    const ctx = initAudio();
    if (!ctx || ctx.state !== 'running') return;
    const baseFreq = 900 - sizeRatio * 500;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2,
                                               ctx.currentTime + 0.06);
    filter.type = 'bandpass';
    filter.frequency.value = baseFreq * 1.5;
    filter.Q.value = 8;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.20, ctx.currentTime + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);
    osc.connect(filter).connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.22);
  }

  const layer = document.getElementById('bubbleLayer');
  const tints = [
    'rgba(255,180,220,0.55)','rgba(180,220,255,0.55)',
    'rgba(200,255,220,0.55)','rgba(255,240,180,0.55)',
    'rgba(230,190,255,0.55)','rgba(180,255,240,0.55)'
  ];
  function spawnBubble() {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 24 + Math.random() * 90;
    const duration = 6 + Math.random() * 6;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = (Math.random() * 100) + 'vw';
    b.style.setProperty('--drift', ((Math.random() - 0.5) * 120) + 'px');
    b.style.setProperty('--tint',
      tints[Math.floor(Math.random() * tints.length)]);
    b.style.animationDuration = duration + 's, 3.2s';
    const popAt = (0.65 + Math.random() * 0.3) * duration * 1000;
    setTimeout(() => {
      if (!b.parentNode) return;
      b.classList.add('pop');
      playPop(size / 88);
      setTimeout(() => b.remove(), 500);
    }, popAt);
    layer.appendChild(b);
    setTimeout(() => b.remove(), duration * 1000 + 800);
  }
  setInterval(spawnBubble, 340);
  for (let i = 0; i < 8; i++) setTimeout(spawnBubble, i * 150);

  const card = document.getElementById('glassCard');
  card.addEventListener('mousemove', (e) => {
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx',
      ((e.clientX - r.left) / r.width) * 100 + '%');
    card.style.setProperty('--my',
      ((e.clientY - r.top) / r.height) * 100 + '%');
  });

  const PROXY_URL = 'https://YOUR-PROXY.vercel.app/api/submit';

  const form = document.getElementById('assessmentForm');
  const btn = document.getElementById('submitBtn');
  const success = document.getElementById('successMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    const data = new FormData(form);
    const payload = {
      name:              data.get('name'),
      research_question: data.get('research_question'),
      ai_tools:          data.get('ai_tools'),
      scientific_method: data.get('scientific_method'),
      justification:     data.get('justification'),
      references:        data.get('references')
    };
    try {
      const res = await fetch(PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if (res.ok && result.success) {
        form.style.display = 'none';
        success.style.display = 'block';
        for (let i = 0; i < 20; i++) setTimeout(spawnBubble, i * 60);
      } else {
        alert('Error: ' + (result.error || 'Submission failed.'));
        btn.disabled = false;
        btn.textContent = 'Submit Response';
      }
    } catch (err) {
      alert('Network error. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Submit Response';
    }
  });
</script>
</body>
</html>
