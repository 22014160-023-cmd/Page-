<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scientific Method & AI Tools – Assessment</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; overflow-x: hidden; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1e3a8a 0%, #6d28d9 50%, #db2777 100%);
    background-size: 400% 400%;
    animation: gradientShift 18s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 60px 16px 80px;
    color: #f8fafc;
    position: relative;
    overflow-x: hidden;
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ---------- BUBBLE LAYER — strictly behind ---------- */
  #bubbleLayer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    bottom: -120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%,
      rgba(255,255,255,0.9),
      rgba(255,255,255,0.25) 40%,
      rgba(255,255,255,0.05) 70%);
    border: 1px solid rgba(255,255,255,0.45);
    box-shadow: inset -4px -4px 8px rgba(255,255,255,0.3),
                0 0 20px rgba(255,255,255,0.25);
    animation: rise linear forwards;
    will-change: transform, opacity;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    10%  { opacity: 0.85; }
    100% { transform: translateY(-115vh) translateX(var(--drift)) scale(1.05); opacity: 0; }
  }
  .bubble.pop { animation: pop 0.45s ease-out forwards; }
  @keyframes pop {
    0%   { transform: scale(1);   opacity: 0.9; }
    40%  { transform: scale(1.5); opacity: 0.6; }
    100% { transform: scale(0);   opacity: 0; }
  }

  /* ---------- GLASS CARD ---------- */
  .card {
    position: relative;
    z-index: 10;
    max-width: 780px;
    width: 100%;
    border-radius: 24px;
    overflow: hidden;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.28);
    box-shadow:
      0 25px 60px rgba(0,0,0,0.35),
      inset 0 1px 0 rgba(255,255,255,0.35);
    animation: cardIn 0.7s ease-out;
  }
  @keyframes cardIn {
    from { transform: translateY(30px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  /* ---------- SHIMMER BORDER ---------- */
  .card::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(120deg,
      rgba(255,255,255,0.7),
      rgba(255,255,255,0.05) 30%,
      rgba(255,255,255,0.05) 70%,
      rgba(255,255,255,0.6));
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: 0.7;
  }

  /* ---------- CURSOR GLOW ---------- */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 24px;
    background: radial-gradient(
      400px circle at var(--mx, 50%) var(--my, 0%),
      rgba(255,255,255,0.14),
      transparent 45%);
    pointer-events: none;
    transition: background 0.15s ease-out;
  }

  /* ---------- HEADER ---------- */
  .header {
    position: relative;
    z-index: 1;
    padding: 36px 40px 28px;
    background: linear-gradient(135deg,
      rgba(99,102,241,0.35),
      rgba(147,51,234,0.30));
    border-bottom: 1px solid rgba(255,255,255,0.22);
    color: #fff;
  }
  .header h1 {
    font-size: 26px;
    margin-bottom: 10px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
    letter-spacing: 0.2px;
  }
  .header p {
    font-size: 15px;
    line-height: 1.55;
    color: rgba(255,255,255,0.88);
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }

  /* ---------- FORM ---------- */
  form { position: relative; z-index: 1; padding: 32px 36px 40px; }

  .field {
    margin-bottom: 22px;
    padding: 18px 18px 20px;
    border-radius: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.22);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.25),
      0 6px 20px rgba(0,0,0,0.15);
    animation: fieldIn 0.6s ease-out backwards;
    transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
  }
  .field:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.35);
  }
  .field:nth-child(1) { animation-delay: 0.10s; }
  .field:nth-child(2) { animation-delay: 0.18s; }
  .field:nth-child(3) { animation-delay: 0.26s; }
  .field:nth-child(4) { animation-delay: 0.34s; }
  .field:nth-child(5) { animation-delay: 0.42s; }
  .field:nth-child(6) { animation-delay: 0.50s; }
  @keyframes fieldIn {
    from { transform: translateY(12px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  label {
    display: block;
    font-weight: 600;
    margin-bottom: 10px;
    font-size: 14px;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    letter-spacing: 0.2px;
  }
  label span { color: #fbcfe8; }

  input, textarea, select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.2s;
    background: rgba(255,255,255,0.10);
    color: #ffffff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  input::placeholder,
  textarea::placeholder {
    color: rgba(255,255,255,0.55);
    text-shadow: none;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.18);
  }
  textarea { resize: vertical; min-height: 90px; }

  /* ---------- BUTTON ---------- */
  button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg,
      rgba(79,70,229,0.9),
      rgba(147,51,234,0.9));
    color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.4px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, background 0.25s;
    margin-top: 8px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 10px 30px rgba(147,51,234,0.45),
      inset 0 1px 0 rgba(255,255,255,0.5);
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow:
      0 14px 40px rgba(147,51,234,0.6),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ---------- SUCCESS ---------- */
  .success {
    display: none;
    text-align: center;
    padding: 50px 40px;
    color: #ffffff;
    font-size: 18px;
    font-weight: 600;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .success .check { font-size: 64px; display: block; margin-bottom: 14px; }

  /* ---------- SOUND TOGGLE ---------- */
  #soundToggle {
    position: fixed;
    top: 16px; right: 16px;
    z-index: 999;
    background: rgba(255,255,255,0.20);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    width: 44px; height: 44px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    transition: transform 0.2s, background 0.2s;
  }
  #soundToggle:hover { transform: scale(1.1); background: rgba(255,255,255,0.3); }

  @media (max-width: 600px) {
    body { padding: 40px 10px 60px; }
    .header { padding: 26px 22px 20px; }
    .header h1 { font-size: 21px; }
    form { padding: 22px 18px 30px; }
    .field { padding: 14px 14px 16px; }
  }
</style>
</head>
<body>

<button id="soundToggle" title="Toggle sound">🔊</button>
<div id="bubbleLayer"></div>

<div class="card" id="glassCard">
  <div class="header">
    <h1>🔬 Scientific Method &amp; AI Tools Assessment</h1>
    <p>Please answer thoughtfully. Your responses will be used for justification and evaluation of your research approach.</p>
  </div>

  <form id="assessmentForm">
    <input type="hidden" name="access_key" value="36579690-c4ad-499a-82c7-34ef6dae066e" />
    <input type="hidden" name="subject" value="New Assessment Response" />
    <input type="hidden" name="from_name" value="Scientific Method Assessment" />

    <div class="field">
      <label>Full Name <span>*</span></label>
      <input type="text" name="name" required placeholder="Your full name" />
    </div>
    <div class="field">
      <label>Research Question You Are Addressing <span>*</span></label>
      <textarea name="research_question" required placeholder="State your scientific question clearly..."></textarea>
    </div>
    <div class="field">
      <label>How You Used AI / Google Tools <span>*</span></label>
      <textarea name="ai_tools" required placeholder="Which tools (Google, AI assistants, etc.) and how did they help?"></textarea>
    </div>
    <div class="field">
      <label>Scientific Method Steps Applied <span>*</span></label>
      <textarea name="scientific_method" required placeholder="Observation → Hypothesis → Experiment → Analysis → Conclusion..."></textarea>
    </div>
    <div class="field">
      <label>Justification / Reasoning <span>*</span></label>
      <textarea name="justification" required placeholder="Why did you choose this approach? Support your reasoning."></textarea>
    </div>
    <div class="field">
      <label>References / Links (optional)</label>
      <textarea name="references" placeholder="Any sources, papers, or links used..."></textarea>
    </div>
    <button type="submit" id="submitBtn">Submit Response</button>
  </form>

  <div class="success" id="successMsg">
    <span class="check">✅</span>
    Thank you! Your response has been submitted successfully.
  </div>
</div>

<script>
  /* ---------- BUBBLES ---------- */
  const layer = document.getElementById('bubbleLayer');
  let soundEnabled = true;
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) audioCtx = new Ctx();
    }
    return audioCtx;
  }

  function playPop(sizeRatio) {
    if (!soundEnabled) return;
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();

    const baseFreq = 900 - sizeRatio * 500;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filter = ctx.createBiquadFilter();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.2, ctx.currentTime + 0.06);

    filter.type = 'bandpass';
    filter.frequency.value = baseFreq * 1.5;
    filter.Q.value = 8;

    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.18);

    osc.connect(filter).connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.22);
  }

  function spawnBubble() {
    const b = document.createElement('div');
    b.className = 'bubble';

    const size = 18 + Math.random() * 70;
    const duration = 6 + Math.random() * 6;
    const startX = Math.random() * 100;
    const drift = (Math.random() - 0.5) * 120;

    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = startX + 'vw';
    b.style.setProperty('--drift', drift + 'px');
    b.style.animationDuration = duration + 's';

    const popAt = (0.65 + Math.random() * 0.3) * duration * 1000;
    setTimeout(() => {
      if (!b.parentNode) return;
      b.classList.add('pop');
      playPop(size / 88);
      setTimeout(() => b.remove(), 500);
    }, popAt);

    layer.appendChild(b);
    setTimeout(() => b.remove(), duration * 1000 + 800);
  }

  setInterval(spawnBubble, 380);
  for (let i = 0; i < 6; i++) setTimeout(spawnBubble, i * 180);

  /* ---------- SOUND TOGGLE ---------- */
  const soundToggle = document.getElementById('soundToggle');
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
  });

  /* ---------- CURSOR GLOW ON CARD ---------- */
  const card = document.getElementById('glassCard');
  card.addEventListener('mousemove', (e) => {
    const rect = card.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    card.style.setProperty('--mx', x + '%');
    card.style.setProperty('--my', y + '%');
  });

  /* ---------- FORM SUBMIT ---------- */
  const form = document.getElementById('assessmentForm');
  const btn = document.getElementById('submitBtn');
  const success = document.getElementById('successMsg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Submitting...';
    const data = new FormData(form);

    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      const result = await res.json();

      if (result.success) {
        form.style.display = 'none';
        success.style.display = 'block';
        for (let i = 0; i < 20; i++) setTimeout(spawnBubble, i * 60);
      } else {
        alert('Error: ' + (result.message || 'Something went wrong.'));
        btn.disabled = false;
        btn.textContent = 'Submit Response';
      }
    } catch (err) {
      alert('Network error. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Submit Response';
    }
  });

  /* ---------- AUDIO UNLOCK ---------- */
  document.addEventListener('touchstart', () => {
    const ctx = getAudioCtx();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }, { once: true });
  document.addEventListener('click', () => {
    const ctx = getAudioCtx();
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }, { once: true });
</script>
</body>
</html>
